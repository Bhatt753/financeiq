<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="manifest" href="/static/manifest.json">
    <title>FinanceIQ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

        html, body {
            width:100%; height:100%;
            font-family:'Inter',sans-serif;
            overflow:hidden;
            background:#060402;
            color:#fff;
        }

        #app { position:relative; width:100%; height:100%; }

        /* BACKGROUND */
        .bg {
            position:absolute; inset:0; z-index:1;
            background-image: url('/static/bg.png.png');
            background-size:cover;
            background-position:center 30%;
            transform:scale(1);
            transition: transform 1.4s cubic-bezier(0.22,1,0.36,1),
                        filter 1.4s cubic-bezier(0.22,1,0.36,1);
            will-change:transform,filter;
        }

        .overlay {
            position:absolute; inset:0; z-index:2;
            background: linear-gradient(180deg,
                rgba(0,0,0,0.1) 0%,
                rgba(0,0,0,0.3) 40%,
                rgba(0,0,0,0.72) 100%
            );
            transition: background 1.4s cubic-bezier(0.22,1,0.36,1);
        }

        /* PAGES */
        .page {
            position:absolute; inset:0; z-index:10;
            display:flex; flex-direction:column;
            pointer-events:none; opacity:0;
            transition: opacity 0.6s cubic-bezier(0.22,1,0.36,1),
                        transform 0.6s cubic-bezier(0.22,1,0.36,1);
        }
        .page.active { pointer-events:all; opacity:1; }

        /* ===== LANDING ===== */
        #landing {
            justify-content:space-between;
            padding: clamp(40px,8vh,80px) clamp(24px,6vw,64px) clamp(36px,7vh,64px);
            transform:translateY(10px);
        }
        #landing.active { transform:translateY(0); }

        .logo {
            font-family:'Playfair Display',serif;
            font-size: clamp(44px,9vw,72px);
            font-weight:500;
            color:#fff;
            letter-spacing:0.04em;
            text-shadow: 0 4px 24px rgba(0,0,0,0.5);
            line-height:1;
            margin-bottom:16px;
        }

        .subtitle {
            font-size: clamp(15px,2.4vw,18px);
            font-weight:300;
            line-height:1.6;
            color:rgba(255,255,255,0.7);
            text-shadow: 0 2px 10px rgba(0,0,0,0.6);
        }

        .btn-signin {
            display:inline-flex;
            align-items:center;
            padding:14px 36px;
            background:rgba(255,255,255,0.88);
            color:#111;
            border:none;
            border-radius:10px;
            font-family:'Inter',sans-serif;
            font-size:15px;
            font-weight:500;
            cursor:pointer;
            backdrop-filter:blur(8px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
            transition: all 0.25s ease;
            letter-spacing:0.1px;
        }

        .btn-signin:hover {
            background:#fff;
            transform:translateY(-2px);
            box-shadow: 0 8px 28px rgba(0,0,0,0.35);
        }

        .btn-signin:active { transform:translateY(0); }

        /* ===== AUTH PAGE ===== */
        #auth {
            justify-content:center;
            align-items:center;
            transform:scale(0.96) translateY(20px);
        }
        #auth.active { transform:scale(1) translateY(0); }

        .auth-backdrop {
            position:absolute; inset:0;
            cursor:pointer; z-index:0;
        }

        .auth-card {
            position:relative; z-index:1;
            background:rgba(22,18,12,0.75);
            backdrop-filter:blur(24px) saturate(1.3);
            -webkit-backdrop-filter:blur(24px) saturate(1.3);
            border:1px solid rgba(255,255,255,0.08);
            border-radius:20px;
            padding:32px 36px 36px;
            width:90%;
            max-width:440px;
            box-shadow: 0 32px 64px rgba(0,0,0,0.6);
        }

        /* Back arrow */
        .btn-back {
            background:none;
            border:none;
            color:rgba(255,255,255,0.7);
            cursor:pointer;
            padding:0;
            margin-bottom:16px;
            display:flex;
            align-items:center;
            font-size:20px;
            transition:color 0.2s;
            line-height:1;
        }
        .btn-back:hover { color:#fff; }

        /* Underline tabs */
        .auth-tabs {
            display:flex;
            gap:28px;
            border-bottom:1px solid rgba(255,255,255,0.12);
            margin-bottom:28px;
        }

        .tab {
            background:none;
            border:none;
            color:rgba(255,255,255,0.4);
            font-family:'Inter',sans-serif;
            font-size:17px;
            font-weight:500;
            cursor:pointer;
            padding:0 0 12px;
            position:relative;
            transition:color 0.22s ease;
        }

        .tab.active {
            color:#fff;
            font-weight:600;
        }

        .tab.active::after {
            content:'';
            position:absolute;
            bottom:-1px; left:0;
            width:100%; height:2px;
            background:#fff;
            border-radius:2px;
        }

        /* Forms */
        .form { display:none; flex-direction:column; gap:18px; }
        .form.active {
            display:flex;
            animation: fadeIn 0.3s ease both;
        }

        @keyframes fadeIn {
            from { opacity:0; transform:translateY(8px); }
            to   { opacity:1; transform:translateY(0); }
        }

        /* Error */
        .err {
            background:rgba(239,68,68,0.12);
            border:1px solid rgba(239,68,68,0.25);
            border-radius:10px;
            padding:11px 14px;
            font-size:13px;
            color:#fca5a5;
            display:flex; gap:8px; align-items:flex-start;
        }

        /* Input group */
        .ig { display:flex; flex-direction:column; gap:7px; }

        .ig label {
            font-size:13px;
            font-weight:400;
            color:rgba(255,255,255,0.6);
        }

        .ig input {
            background:rgba(255,255,255,0.07);
            border:1px solid rgba(255,255,255,0.1);
            border-radius:12px;
            padding:14px 16px;
            font-family:'Inter',sans-serif;
            font-size:15px;
            color:#fff;
            outline:none;
            transition:all 0.22s ease;
            -webkit-appearance:none;
            width:100%;
        }

        .ig input::placeholder { color:rgba(255,255,255,0.22); }

        .ig input:focus {
            border-color:rgba(255,255,255,0.35);
            background:rgba(255,255,255,0.1);
            box-shadow:0 0 0 3px rgba(255,255,255,0.06);
        }

        .two-col {
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:12px;
        }

        .forgot {
            text-align:right;
            margin-top:-6px;
        }

        .forgot a {
            font-size:13px;
            color:rgba(255,255,255,0.45);
            text-decoration:none;
            transition:color 0.2s;
        }

        .forgot a:hover { color:#fff; }

        /* Submit */
        .btn-submit {
            padding:15px;
            background:#fff;
            color:#111;
            border:none;
            border-radius:12px;
            font-family:'Inter',sans-serif;
            font-size:15px;
            font-weight:600;
            cursor:pointer;
            transition:all 0.22s ease;
            box-shadow:0 4px 18px rgba(0,0,0,0.3);
            margin-top:2px;
        }

        .btn-submit:hover {
            background:#f0f0f0;
            transform:translateY(-1px);
            box-shadow:0 8px 28px rgba(0,0,0,0.4);
        }

        .btn-submit:active { transform:translateY(0); }

        /* Divider */
        .or {
            display:flex; align-items:center; gap:10px;
        }
        .or::before,.or::after {
            content:''; flex:1; height:1px;
            background:rgba(255,255,255,0.1);
        }
        .or span {
            font-size:12px;
            color:rgba(255,255,255,0.28);
            text-transform:uppercase;
            letter-spacing:0.8px;
        }

        /* Google */
        .btn-google {
            display:flex; align-items:center; justify-content:center; gap:10px;
            padding:13px;
            background:rgba(255,255,255,0.06);
            border:1px solid rgba(255,255,255,0.1);
            border-radius:12px;
            color:rgba(255,255,255,0.72);
            font-family:'Inter',sans-serif;
            font-size:14px; font-weight:500;
            text-decoration:none;
            transition:all 0.22s ease;
        }
        .btn-google:hover {
            background:rgba(255,255,255,0.11);
            border-color:rgba(255,255,255,0.22);
            color:#fff;
        }
        .btn-google img { width:17px; height:17px; }

        /* Legal */
        .legal {
            text-align:center;
            margin-top:20px;
            font-size:11px;
            color:rgba(255,255,255,0.2);
        }
        .legal a {
            color:rgba(255,255,255,0.3);
            text-decoration:none; margin:0 5px;
        }
        .legal a:hover { color:rgba(255,255,255,0.6); }

        /* BODY STATE */
        body.auth-open .bg {
            transform:scale(1.07);
            filter:blur(14px) brightness(0.4);
        }
        body.auth-open .overlay {
            background:rgba(0,0,0,0.65);
        }

        .auth-card::-webkit-scrollbar { width:3px; }
        .auth-card::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.12); border-radius:2px; }
    </style>
</head>
<body>
<div id="app">
    <div class="bg"></div>
    <div class="overlay"></div>

    <!-- ===== LANDING ===== -->
    <div id="landing" class="page active">
        <div>
            <h1 class="logo">FINANCEIQ</h1>
            <p class="subtitle">invest your<br>money in smarter way.</p>
        </div>
        <div>
            <button class="btn-signin" id="btn-signin">Sign in</button>
        </div>
    </div>

    <!-- ===== AUTH CARD ===== -->
    <div id="auth" class="page">
        <div class="auth-backdrop" id="auth-backdrop"></div>

        <div class="auth-card">

            <!-- Back arrow -->
            <button class="btn-back" id="btn-back">&#8249;</button>

            <!-- Tabs -->
            <div class="auth-tabs">
                <button class="tab active" data-form="signin-form">Sign In</button>
                <button class="tab" data-form="signup-form">Sign Up</button>
            </div>

            <!-- SIGN IN -->
            <div id="signin-form" class="form active">
                {% if error %}
                <div class="err">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;margin-top:1px"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                    {{ error }}
                </div>
                {% endif %}

                <form method="POST" action="/login" style="display:contents">
                    <div class="ig">
                        <label>Username</label>
                        <input type="text" name="username" placeholder="Enter your username" required autocomplete="username">
                    </div>
                    <div class="ig">
                        <label>Password</label>
                        <input type="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                    </div>
                    <div class="forgot"><a href="#">Forgot password?</a></div>
                    <button type="submit" class="btn-submit">Sign In</button>
                </form>

                <div class="or"><span>or</span></div>
                <a href="/login/google" class="btn-google">
                    <img src="https://www.google.com/favicon.ico" alt="">
                    Continue with Google
                </a>
            </div>

            <!-- SIGN UP -->
            <div id="signup-form" class="form">
                {% if error %}
                <div class="err">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;margin-top:1px"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                    {{ error }}
                </div>
                {% endif %}

                <form method="POST" action="/register" style="display:contents">
                    <div class="two-col">
                        <div class="ig">
                            <label>Full Name</label>
                            <input type="text" name="name" placeholder="Your name" required>
                        </div>
                        <div class="ig">
                            <label>Profession</label>
                            <input type="text" name="profession" placeholder="Engineer" required>
                        </div>
                    </div>
                    <div class="ig">
                        <label>Email Address</label>
                        <input type="email" name="email" placeholder="you@email.com" required>
                    </div>
                    <div class="two-col">
                        <div class="ig">
                            <label>Username</label>
                            <input type="text" name="username" placeholder="Choose one" required>
                        </div>
                        <div class="ig">
                            <label>Password</label>
                            <input type="password" name="password" placeholder="Min 6 chars" required>
                        </div>
                    </div>
                    <button type="submit" class="btn-submit">Create Account</button>
                </form>

                <div class="or"><span>or</span></div>
                <a href="/login/google" class="btn-google">
                    <img src="https://www.google.com/favicon.ico" alt="">
                    Sign up with Google
                </a>
            </div>

            <div class="legal">
                <a href="/privacy">Privacy Policy</a> ·
                <a href="/terms">Terms of Service</a>
            </div>
        </div>
    </div>
</div>

<script>
(function(){
    const landing  = document.getElementById('landing');
    const auth     = document.getElementById('auth');
    const btnStart = document.getElementById('btn-signin');
    const btnBack  = document.getElementById('btn-back');
    const backdrop = document.getElementById('auth-backdrop');
    const tabs     = document.querySelectorAll('.tab');

    function openAuth(){
        document.body.classList.add('auth-open');
        landing.classList.remove('active');
        setTimeout(()=> auth.classList.add('active'), 80);
    }

    function closeAuth(){
        document.body.classList.remove('auth-open');
        auth.classList.remove('active');
        setTimeout(()=> landing.classList.add('active'), 300);
    }

    btnStart.addEventListener('click', openAuth);
    btnBack.addEventListener('click', closeAuth);
    backdrop.addEventListener('click', closeAuth);

    tabs.forEach(tab => {
        tab.addEventListener('click', ()=>{
            tabs.forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
            document.getElementById(tab.getAttribute('data-form')).classList.add('active');
        });
    });

    {% if error %}openAuth();{% endif %}

    if('serviceWorker' in navigator){
        navigator.serviceWorker.register('/static/sw.js').catch(()=>{});
    }
})();
</script>
</body>
</html>
