<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#F8F6F1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Register | FinanceIQ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #F8F6F1;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: #FFFFFF;
            border: 1px solid #E5E7EB;
            border-radius: 24px;
            padding: 44px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            animation: fadeUp 0.4s ease both;
        }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo h1 {
            color: #111827; font-size: 26px; font-weight: 700;
            letter-spacing: -0.5px;
        }
        .logo p { color: #6B7280; font-size: 14px; margin-top: 6px; }

        .form-group { margin-bottom: 16px; }

        label {
            color: #374151; font-size: 13px; font-weight: 500;
            margin-bottom: 7px; display: block;
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            background: #F9FAFB;
            border: 1px solid #E5E7EB;
            border-radius: 12px;
            color: #111827;
            font-size: 15px;
            outline: none;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }
        input:focus, select:focus {
            border-color: #16A34A;
            box-shadow: 0 0 0 3px rgba(22,163,74,0.1);
            background: #FFFFFF;
        }
        input::placeholder { color: #9CA3AF; }
        select option { background: #FFFFFF; color: #111827; }

        .btn {
            width: 100%;
            padding: 13px;
            background: #16A34A;
            border: none;
            border-radius: 12px;
            color: #FFFFFF;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            margin-top: 8px;
            transition: all 0.2s;
        }
        .btn:hover { background: #15803D; transform: translateY(-1px); box-shadow: 0 6px 16px rgba(22,163,74,0.25); }

        .error {
            background: #FEF2F2;
            border: 1px solid #FEE2E2;
            color: #B91C1C;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            display: flex; align-items: center; gap: 8px;
        }

        .link {
            text-align: center; margin-top: 22px;
            color: #6B7280; font-size: 14px;
        }
        .link a { color: #16A34A; text-decoration: none; font-weight: 600; }
        .link a:hover { color: #15803D; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <h1>FinanceIQ</h1>
            <p>Create your account</p>
        </div>

        {% if error %}
        <div class="error">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" placeholder="Your full name" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="your@gmail.com" required>
            </div>
            <div class="form-group">
                <label>Profession</label>
                <input type="text" name="profession" placeholder="e.g. Student, Engineer, Doctor" required>
            </div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Choose a username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Choose a password" required>
            </div>
            <button type="submit" class="btn">Create Account</button>
        </form>

        <div class="link">
            Already have an account? <a href="/login">Login here</a>
        </div>
    </div>
</body>
</html>
