<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F8F6F1">
    <title>Setup Profile | FinanceIQ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #F8F6F1;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: #FFFFFF;
            border: 1px solid #E5E7EB;
            border-radius: 24px;
            padding: 44px 40px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            animation: fadeUp 0.4s ease both;
        }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

        .brand {
            font-size: 20px; font-weight: 700; color: #111827;
            letter-spacing: -0.3px; margin-bottom: 28px;
        }

        .avatar {
            width: 80px; height: 80px;
            border-radius: 50%;
            margin: 0 auto 16px;
            display: block;
            border: 3px solid #16A34A;
            object-fit: cover;
        }
        .avatar-placeholder {
            width: 80px; height: 80px;
            border-radius: 50%;
            background: #DCFCE7;
            border: 3px solid #16A34A;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 16px;
        }
        .avatar-placeholder svg { color: #16A34A; }

        h2 {
            color: #111827; font-size: 20px; font-weight: 700;
            margin-bottom: 6px; letter-spacing: -0.2px;
        }
        .subtitle { color: #6B7280; font-size: 14px; margin-bottom: 28px; line-height: 1.5; }

        label {
            color: #374151; font-size: 13px; font-weight: 500;
            margin-bottom: 7px; display: block; text-align: left;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            background: #F9FAFB;
            border: 1px solid #E5E7EB;
            border-radius: 12px;
            color: #111827;
            font-size: 15px;
            outline: none;
            margin-bottom: 20px;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus {
            border-color: #16A34A;
            box-shadow: 0 0 0 3px rgba(22,163,74,0.1);
            background: #FFFFFF;
        }
        input::placeholder { color: #9CA3AF; }

        .btn {
            width: 100%;
            padding: 13px;
            background: #16A34A;
            border: none;
            border-radius: 12px;
            color: #FFFFFF;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
        }
        .btn:hover { background: #15803D; transform: translateY(-1px); box-shadow: 0 6px 16px rgba(22,163,74,0.25); }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">FinanceIQ</div>

        {% if session.avatar %}
        <img src="{{ session.avatar }}" class="avatar" alt="Profile">
        {% else %}
        <div class="avatar-placeholder">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
        {% endif %}

        <h2>Welcome, {{ session.name }}!</h2>
        <p class="subtitle">One last thing — what is your profession?</p>

        <form method="POST">
            <label>Your Profession</label>
            <input type="text" name="profession"
                   placeholder="e.g. Student, Engineer, Doctor" required>
            <button type="submit" class="btn">Get Started</button>
        </form>
    </div>
</body>
</html>
