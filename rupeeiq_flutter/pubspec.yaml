name: rupeeiq
description: RupeeIQ — Smart Budget Planner
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Networking
  http: ^1.1.0

  # Local storage (JWT token)
  shared_preferences: ^2.2.2

  # Charts
  fl_chart: ^0.66.2

  # SMS reading
  telephony: ^0.2.0

  # Permissions
  permission_handler: ^11.3.0

  # Formatting
  intl: ^0.19.0

  # State management
  provider: ^6.1.1

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
