name: rupeeiq_app
description: "RupeeIQ — Smart Budget Planner"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Networking
  http: ^1.2.0

  # Token + prefs storage
  flutter_secure_storage: ^9.0.0

  # Charts
  fl_chart: ^0.69.0

  # State management
  provider: ^6.1.2

  # Typography
  google_fonts: ^6.2.1

  # Permissions (SMS read)
  permission_handler: ^11.3.1

  # SMS inbox access
  flutter_sms_inbox: ^1.0.3

  # Google Sign-In
  google_sign_in: ^6.1.6
  googleapis_auth: ^1.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
